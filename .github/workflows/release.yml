name: Package and publish requested release

on:
  push:
    branches: [main]
    paths: [release/request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'PaulWai0087/Samsung-TV-Unlock-Local-Set' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release automation and complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package verified source, check uploaded bytes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: python3 tools/publish_release.py --request release/request.json --output-dir "$RUNNER_TEMP/release-assets" --publish
